<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رود راش</title>
<style>
:root{--bg:#120d1f;--fg:#f4f1ff;--mut:#9a92c9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120d1f;--fg:#f4f1ff;--mut:#9a92c9}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:Tahoma,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
#hud{display:flex;justify-content:space-between;align-items:center;width:min(94vw,480px,calc(64vh*.75));width:min(94vw,480px,calc((100dvh - 200px)*.75));font-size:16px}
#mt{border:0;background:none;font-size:20px;cursor:pointer;color:var(--fg);min-width:44px;min-height:44px}
canvas{width:min(94vw,480px,calc(64vh*.75));width:min(94vw,480px,calc((100dvh - 200px)*.75));height:auto;aspect-ratio:3/4;background:#000;border-radius:8px}
#msg{min-height:20px;font-size:14px;color:var(--mut);text-align:center}
#pad{display:flex;gap:8px;direction:ltr;width:min(94vw,480px)}
#pad i{flex:.4}
#pad button{height:68px;flex:1;min-width:0;padding:0;font-size:20px;border:0;border-radius:14px;background:#2c2466;color:var(--fg);touch-action:none;-webkit-tap-highlight-color:transparent}
#pad button:active{background:#5440c0}
#pad button:focus-visible,#mt:focus-visible{outline:2px solid var(--fg)}
</style>
</head>
<body>
<div id="hud"><span>المركز: <b id="rk">6</b>/6</span><span>السرعة: <b id="sp">0</b></span><button id="mt" onclick="toggleMute()" aria-label="كتم الصوت">🔊</button></div>
<canvas id="c" width="480" height="640"></canvas>
<div id="msg"></div>
<div id="pad">
 <button data-k="L" aria-label="يسار">◀</button><button data-k="R" aria-label="يمين">▶</button><i></i><button data-k="B" aria-label="فرامل">🛑</button><i></i><button data-k="PL" aria-label="ضربة يسار">👊◀</button><button data-k="PR" aria-label="ضربة يمين">▶👊</button>
</div>
<script>
const CW=480,CH=640,HY=250,LEN=45000,cv=document.getElementById('c'),x=cv.getContext('2d');
const cxs=new Float32Array(CH),hws=new Float32Array(CH);
const COLS=['#ff3b3b','#ffb13b','#3bf0ff','#c05bff','#4cd964'];
let pos,px,spd,hp,state,rivals,keys={},lean,pT,pS,pCD,bgX,last=0,acc=0,rank;
function curveAt(z){return Math.sin(z/2600)*.8+Math.sin(z/1100+1)*.4}
function msg(t){document.getElementById('msg').textContent=t}
function reset(){
 pos=0;px=0;spd=0;hp=100;lean=0;pT=0;pS=1;pCD=0;bgX=0;rank=6;state='ready';
 rivals=COLS.map((c,i)=>({z:90+i*80,u:-.7+i*.35,lane:-.7+i*.35,v:0,base:11.5+Math.random()*2.6,hp:3,down:0,cd:0,col:c}));
 msg('اضغط أي زرار للانطلاق');
}
function begin(){ac();if(state=='ready'){state='run';msg('')}else if(state!='run')reset()}
function punch(side){
 if(state!='run'||pCD>0)return;
 pCD=16;pT=9;pS=side;sfx('whoosh');
 for(const r of rivals){
  const dz=r.z-pos,du=(r.u-px)*side;
  if(r.down==0&&Math.abs(dz)<75&&du>.08&&du<.75){
   r.hp--;r.u+=side*.3;r.v*=.7;sfx('hit');
   if(r.hp<=0){r.down=80;r.v=0;sfx('crash')}
   break;
  }
 }
}
function step(){
 if(state!='run')return;
 const MX=15;
 if(keys.B)spd-=.45;else if(spd<MX)spd+=.1;
 if(Math.abs(px)>1.05){if(spd>6)spd-=.3;hp-=.03}
 spd=Math.max(0,spd);
 const s=keys.L?-1:keys.R?1:0;
 px+=s*.03*(.4+spd/MX);px-=curveAt(pos)*spd*.0011;px=Math.max(-1.5,Math.min(1.5,px));
 lean=lean*.8+s*.05;
 pos+=spd;bgX-=curveAt(pos)*spd*.25;
 if(pCD>0)pCD--;if(pT>0)pT--;
 for(const r of rivals){
  if(r.down>0){if(--r.down==0){r.hp=3;r.z=pos-250;r.v=spd}continue}
  let tg=r.base;if(r.z<pos-200)tg+=2.5;if(r.z>pos+500)tg-=2;
  r.v+=(tg-r.v)*.05;r.z+=r.v;
  const dz=r.z-pos,du=px-r.u;
  const tu=Math.abs(dz)<220?px+(r.u<px?-.35:.35):r.lane;
  r.u+=Math.max(-.012,Math.min(.012,tu-r.u));r.u=Math.max(-.95,Math.min(.95,r.u));
  if(r.cd>0)r.cd--;
  if(Math.abs(dz)<70&&Math.abs(du)>.1&&Math.abs(du)<.7&&r.cd==0&&Math.random()<.04){
   hp-=6;px+=du>0?.22:-.22;spd*=.92;r.cd=70;sfx('hit');
  }
  if(Math.abs(dz)<25&&Math.abs(du)<.12){
   hp-=5;spd*=.6;r.u-=du>0?-.2:.2;px+=du>0?.12:-.12;r.cd=40;sfx('crash');
  }
 }
 rank=1+rivals.filter(r=>r.z>pos).length;
 if(hp<=0){state='over';hp=0;msg('وقعت من على الموتوسيكل! اضغط للعب تاني');sfx('over')}
 else if(pos>=LEN){state='done';msg('خلصت السباق في المركز '+rank+' من 6! اضغط للعب تاني');sfx(rank<=3?'win':'over')}
}
function bike(X,Y,s,col,ln,down,pun){
 x.save();x.translate(X,Y);x.scale(s,s);
 if(down){x.rotate(1.3);x.translate(0,-8)}else x.rotate(ln);
 x.fillStyle='#111';x.fillRect(-5,-30,10,30);
 x.fillStyle=col;x.fillRect(-14,-46,28,18);
 x.fillStyle='#2a2f6b';x.fillRect(-15,-76,30,32);
 x.fillRect(-24,-72,9,20);x.fillRect(15,-72,9,20);
 x.fillStyle='#ffd9a0';x.beginPath();x.arc(0,-86,10,0,7);x.fill();
 x.fillStyle=col;x.beginPath();x.arc(0,-88,11,Math.PI,0);x.fill();
 if(pun){x.fillStyle='#2a2f6b';x.fillRect(pun>0?15:-45,-68,30,9);x.fillStyle='#ffd9a0';x.beginPath();x.arc(pun*46,-64,8,0,7);x.fill()}
 x.restore();
}
function tree(X,Y,t){
 x.fillStyle='#4a2f1a';x.fillRect(X-4*t*2,Y-40*t*2,8*t*2,40*t*2);
 x.fillStyle='#0f5a2a';x.beginPath();x.moveTo(X,Y-130*t*2);x.lineTo(X-30*t*2,Y-30*t*2);x.lineTo(X+30*t*2,Y-30*t*2);x.fill();
}
function draw(){
 let g=x.createLinearGradient(0,0,0,HY);g.addColorStop(0,'#2b1b5e');g.addColorStop(1,'#ff8a5b');
 x.fillStyle=g;x.fillRect(0,0,CW,HY);
 x.fillStyle='#ffd27a';x.beginPath();x.arc(CW/2+bgX*.2%CW,HY-50,28,0,7);x.fill();
 x.fillStyle='#3a2468';x.beginPath();x.moveTo(0,HY);
 for(let i=0;i<=CW;i+=8)x.lineTo(i,HY-30-20*Math.sin((i-bgX)/60)-14*Math.sin((i-bgX)/23));
 x.lineTo(CW,HY);x.fill();
 let sh=0,dv=0;
 for(let y=CH-1;y>=HY;y--){
  const t=Math.max((y-HY)/(CH-HY),.02),dz=150*(1/t-1);
  dv+=curveAt(pos+dz)*.0028;sh+=dv;
  const hw=20+t*250,cx=CW/2+sh-px*hw*.9;cxs[y]=cx;hws[y]=hw;
  const st=Math.floor(3/t+pos/80)&1;
  x.fillStyle=st?'#1f7a3a':'#1a6b33';x.fillRect(0,y,CW,1);
  x.fillStyle=st?'#e8e8f0':'#d22';x.fillRect(cx-hw*1.1,y,hw*2.2,1);
  x.fillStyle=st?'#4a4a58':'#50505e';x.fillRect(cx-hw,y,hw*2,1);
  if(st){x.fillStyle='#ffe94d';x.fillRect(cx-hw*.02,y,hw*.04,1)}
 }
 const sp=[];
 for(let i=1;i<22;i++){const z=(Math.floor(pos/250)+i)*250;sp.push({dz:z-pos,u:((z/250)&1)?1.6:-1.6,tree:1})}
 for(const r of rivals){const dz=r.z-pos;if(dz>-30&&dz<3200)sp.push({dz,u:r.u,r})}
 sp.sort((a,b)=>b.dz-a.dz);
 const fdz=LEN-pos;
 if(fdz>0&&fdz<3200){
  const t=1/(1+fdz/150),y=Math.min(CH-1,Math.floor(HY+t*(CH-HY))),hw=hws[y],cx=cxs[y];
  for(let k=0;k<10;k++){x.fillStyle=k&1?'#fff':'#111';x.fillRect(cx-hw+k*hw/5,y-10*t*2,hw/5,10*t*2)}
 }
 for(const o of sp){
  const t=1/(1+Math.max(o.dz,0)/150),y=Math.min(CH-1,Math.floor(HY+t*(CH-HY))),X=cxs[y]+o.u*hws[y];
  if(o.tree)tree(X,y,t);
  else bike(X,y,t*1.05,o.r.col,0,o.r.down>0,0);
 }
 bike(CW/2,CH-30,1.15,'#ff3b3b',lean,false,pT>0?pS:0);
 x.fillStyle='rgba(0,0,0,.5)';x.fillRect(10,10,160,12);x.fillRect(CW-170,10,160,12);
 x.fillStyle=hp>40?'#4cd964':'#ff4b4b';x.fillRect(10,10,160*hp/100,12);
 x.fillStyle='#3bf0ff';x.fillRect(CW-170,10,160*Math.min(1,pos/LEN),12);
 x.fillStyle='#fff';x.font='11px Tahoma';x.textAlign='left';x.fillText('HP',14,32);x.textAlign='right';x.fillText('%',CW-14,32);
 document.getElementById('rk').textContent=rank;
 document.getElementById('sp').textContent=Math.round(spd*12);
 if(eng){const t0=AC.currentTime;engG.gain.setTargetAtTime(muted||state!='run'?0:.025,t0,.05);eng.frequency.setTargetAtTime(45+spd*9,t0,.05)}
}
function loop(t){acc+=Math.min(t-last,50);last=t;while(acc>=16){step();acc-=16}draw();requestAnimationFrame(loop)}
let AC=null,muted=false,eng=null,engG=null;
function ac(){try{
 if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();eng=AC.createOscillator();engG=AC.createGain();eng.type='sawtooth';engG.gain.value=0;eng.connect(engG);engG.connect(AC.destination);eng.start()}
 if(AC.state=='suspended')AC.resume()}catch(e){}}
function tone(f,d,type,v,f2,at){
 if(!AC||muted)return;
 const t=AC.currentTime+(at||0),o=AC.createOscillator(),gn=AC.createGain();
 o.type=type||'square';o.frequency.setValueAtTime(f,t);
 if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
 gn.gain.setValueAtTime(v||.06,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);
 o.connect(gn);gn.connect(AC.destination);o.start(t);o.stop(t+d);
}
function sfx(n){
 if(n=='whoosh')tone(900,.09,'triangle',.04,300);
 else if(n=='hit')tone(160,.13,'square',.09,50);
 else if(n=='crash')tone(220,.5,'sawtooth',.09,40);
 else if(n=='win')[523,659,784,1047].forEach((f,i)=>tone(f,.15,'square',.06,0,i*.1));
 else if(n=='over')tone(400,1,'sawtooth',.08,40);
}
function toggleMute(){muted=!muted;document.getElementById('mt').textContent=muted?'🔇':'🔊'}
const KM={ArrowLeft:'L',a:'L',ArrowRight:'R',d:'R',ArrowDown:'B',s:'B',z:'PL',q:'PL',x:'PR',e:'PR'};
addEventListener('keydown',e=>{
 const k=KM[e.key];
 if(k||e.key==' '||e.key=='ArrowUp')e.preventDefault();
 if(e.repeat)return;
 begin();
 if(k=='PL')punch(-1);else if(k=='PR')punch(1);else if(k)keys[k]=true;
});
addEventListener('keyup',e=>{const k=KM[e.key];if(k)keys[k]=false});
document.querySelectorAll('#pad button').forEach(b=>{
 const k=b.dataset.k,off=()=>{keys[k]=false};
 b.addEventListener('pointerdown',e=>{e.preventDefault();begin();if(k=='PL')punch(-1);else if(k=='PR')punch(1);else keys[k]=true});
 ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,off));
});
cv.addEventListener('pointerdown',begin);
addEventListener('contextmenu',e=>e.preventDefault());
reset();requestAnimationFrame(loop);
</script>
</body>
</html>
