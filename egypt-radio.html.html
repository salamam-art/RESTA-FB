<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>راديو مصر</title>
<style>
:root{--bg:#fbf8f2;--card:#fff;--tx:#1d1b16;--mut:#7a746a;--ac:#b8860b;--ac2:#8a6508;--bd:#e6dfd0;--err:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15130f;--card:#201d17;--tx:#f3eee3;--mut:#a39b8b;--ac:#e0b04a;--ac2:#f0c872;--bd:#352f24;--err:#f2b8b5}}
:root[data-theme="dark"]{--bg:#15130f;--card:#201d17;--tx:#f3eee3;--mut:#a39b8b;--ac:#e0b04a;--ac2:#f0c872;--bd:#352f24;--err:#f2b8b5}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;padding-bottom:190px}
header{padding:18px 16px 8px}
h1{margin:0;font-size:24px}
.sub{color:var(--mut);font-size:13px;margin-top:4px}
.bar{padding:8px 16px;display:flex;gap:8px;flex-wrap:wrap}
input[type=search],input[type=text],input[type=url]{flex:1;min-width:0;padding:11px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font-size:15px;font-family:inherit}
.tabs{display:flex;gap:8px;padding:0 16px 8px;overflow-x:auto}
.tab{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 14px;border-radius:20px;font-size:14px;white-space:nowrap;font-family:inherit}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
ul{list-style:none;margin:0;padding:4px 16px;display:grid;gap:8px}
li{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 12px}
li.cur{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.main{flex:1;min-width:0;text-align:right;background:none;border:0;color:inherit;font-family:inherit;padding:2px}
.nm{font-size:16px;font-weight:600}
.ds{font-size:12px;color:var(--mut);margin-top:2px}
.fav{background:none;border:0;font-size:22px;color:var(--mut);padding:4px 8px}
.fav.on{color:var(--ac)}
.del{background:none;border:0;color:var(--err);font-size:18px;padding:4px 8px}
.empty{text-align:center;color:var(--mut);padding:30px 16px}
.add{margin:10px 16px;padding:12px;border:1px dashed var(--bd);border-radius:14px}
.add summary{cursor:pointer;color:var(--ac2);font-size:14px}
.add .row{display:grid;gap:8px;margin-top:10px}
.btn{background:var(--ac);color:#fff;border:0;padding:11px;border-radius:12px;font-size:15px;font-family:inherit}
.player{position:fixed;inset:auto 0 0 0;background:var(--card);border-top:1px solid var(--bd);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 20px rgba(0,0,0,.08)}
.pt{display:flex;align-items:center;gap:12px}
.play{width:56px;height:56px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:22px;flex:none}
.info{flex:1;min-width:0}
.info b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{font-size:12px;color:var(--mut)}
.st.err{color:var(--err)}
.vol{display:flex;align-items:center;gap:8px;margin-top:10px}
.vol input{flex:1;accent-color:var(--ac)}
.nav{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:50%;width:38px;height:38px;font-size:16px;flex:none}
.note{font-size:12px;color:var(--mut);padding:6px 16px 14px;line-height:1.7}
</style>
</head>
<body>
<header>

  <div class="sub">محطات مصرية عبر الإنترنت — بث مباشر</div>
</header>
<div class="bar"><input type="search" id="q" placeholder="ابحث عن محطة…" aria-label="بحث"></div>
<div class="tabs" id="tabs"></div>
<ul id="list"></ul>

<details class="add" id="addbox">

    <input type="text" id="an" placeholder="اسم المحطة">
    <input type="url" id="au" placeholder="رابط البث https://…" dir="ltr">

    <a id="sl" href="#" target="_blank" rel="noopener" style="display:none;color:var(--ac2);font-size:14px">🔎 ابحث عن رابط بث هذه المحطة</a>
  </div>
</details>
<div class="note">إذا لم تعمل محطة، فغالبًا غيّرت جهتها رابط البث. استخدم «أضف محطة» لوضع الرابط الحالي من موقع المحطة الرسمي، وسيُحفظ على جهازك.</div>

<div class="player">
  <div class="pt">
    <button class="nav" id="next" aria-label="التالي">⏮</button>
    <button class="play" id="pp" aria-label="تشغيل">▶</button>
    <button class="nav" id="prev" aria-label="السابق">⏭</button>
    <div class="info"><b id="cn">اختر محطة</b><span class="st" id="cs">جاهز</span></div>
  </div>
  <div class="vol"><span>🔈</span><input type="range" id="vol" min="0" max="1" step="0.01" value="0.8" aria-label="مستوى الصوت"><span>🔊</span></div>
</div>
<audio id="au_el" preload="none"></audio>

<script>

{id:"o5",n:"راديو عمرو دياب",d:"أونلاين",c:"online",u:"https://stream-40.zeno.fm/xa4yhh4k838uv?zs=gojgaFRaRrK1wgGIwdv6xA"},

{id:"n1",n:"الجزيرة",d:"شبكة الجزيرة · قطر · صوت القناة",c:"news",u:"https://live-hls-apps-aja-fa.getaj.net/AJA/index.m3u8"},
{id:"n2",n:"الجزيرة مباشر",d:"شبكة الجزيرة · قطر · صوت القناة",c:"news",u:"https://live-hls-apps-ajm-fa.getaj.net/AJM/index.m3u8"},
{id:"n3",n:"Al Jazeera English",d:"شبكة الجزيرة · قطر · بالإنجليزية",c:"news",u:"https://live-hls-web-aje.getaj.net/AJE/index.m3u8"},
{id:"n4",n:"الجزيرة الوثائقية",d:"شبكة الجزيرة · قطر",c:"news",u:""},
{id:"n5",n:"العربية",d:"السعودية · صوت القناة",c:"news",u:"https://live.alarabiya.net/alarabiapublish/alarabiya.smil/playlist.m3u8"},
{id:"n6",n:"الحدث",d:"العربية · السعودية · صوت القناة",c:"news",u:"https://live.alarabiya.net/alarabiapublish/alhadath.smil/playlist.m3u8"},
{id:"n7",n:"العربية Business",d:"السعودية · صوت القناة",c:"news",u:""},
{id:"n8",n:"الشرق للأخبار",d:"السعودية · صوت القناة",c:"news",u:""}
];
const $=s=>document.getElementById(s);
const au=$("au_el"),list=$("list"),tabs=$("tabs");
function ld(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let custom=ld("eg_custom",[]),favs=ld("eg_favs",[]),tab="all",cur=null;
const all=()=>BASE.concat(custom);
let urls=ld("eg_urls",{});const url=s=>urls[s.id]||s.u;let editing=null;
const TABS=[["all","الكل"],["fav","المفضلة"],["music","أغاني"],["ertu","حكومية"],["local","إقليمية"],["online","أونلاين"],["sport","رياضة"],["news","أخبار"],["quran","قرآن"],["custom","إضافاتي"]];
function vis(){
  const q=$("q").value.trim();
  return all().filter(s=>{
    if(tab==="fav"&&!favs.includes(s.id))return false;
    if(tab!=="all"&&tab!=="fav"&&s.c!==tab)return false;
    return !q||(s.n+s.d).includes(q);
  });
}
function render(){
  tabs.innerHTML="";
  TABS.forEach(([k,l])=>{const b=document.createElement("button");b.className="tab"+(tab===k?" on":"");b.textContent=l;b.onclick=()=>{tab=k;render()};tabs.appendChild(b)});
  list.innerHTML="";
  const v=vis();
  if(!v.length){list.innerHTML='<div class="empty">لا توجد محطات هنا</div>';return}
  v.forEach(s=>{
    const li=document.createElement("li");if(cur&&cur.id===s.id)li.className="cur";
    const m=document.createElement("button");m.className="main";
    m.innerHTML='<div class="nm"></div><div class="ds"></div>';
    m.firstChild.textContent=s.n;m.lastChild.textContent=s.d+(url(s)?"":" · ⚠ بحاجة لرابط بث");
    m.onclick=()=>play(s);
    const f=document.createElement("button");f.className="fav"+(favs.includes(s.id)?" on":"");f.textContent=favs.includes(s.id)?"★":"☆";f.setAttribute("aria-label","مفضلة");
    f.onclick=()=>{favs=favs.includes(s.id)?favs.filter(x=>x!==s.id):favs.concat(s.id);sv("eg_favs",favs);render()};
    li.append(m);
    const ed=document.createElement("button");ed.className="del";ed.style.color="var(--mut)";ed.textContent="✎";ed.setAttribute("aria-label","تعديل الرابط");ed.onclick=()=>edit(s);li.append(ed);
    if(s.c==="custom"){const d=document.createElement("button");d.className="del";d.textContent="🗑";d.setAttribute("aria-label","حذف");d.onclick=()=>{custom=custom.filter(x=>x.id!==s.id);sv("eg_custom",custom);render()};li.append(d)}
    li.append(f);list.appendChild(li);
  });
}
function status(t,e){const el=$("cs");el.textContent=t;el.className="st"+(e?" err":"")}
function edit(s){
  editing=s.id;const box=$("addbox");box.open=true;
  $("an").value=s.n;$("au").value=url(s)||"";
  const sl=$("sl");sl.href="https://www.google.com/search?q="+encodeURIComponent(s.n+" بث مباشر رابط");sl.style.display="block";
  status("عدّل رابط «"+s.n+"» في الخانة بالأسفل ثم احفظ");
  box.scrollIntoView({behavior:"smooth",block:"center"});
}
$("addbox").ontoggle=()=>{if(!$("addbox").open){editing=null;$("sl").style.display="none"}};
function play(s){
  if(!url(s)){
    editing=s.id;$("addbox").open=true;$("an").value=s.n;$("au").value="";
    const sl=$("sl");sl.href="https://www.google.com/search?q="+encodeURIComponent(s.n+" بث مباشر");sl.style.display="block";
    $("cn").textContent=s.n;status("هذه المحطة بحاجة لرابط بث، الصقه في خانة الإضافة بالأسفل",true);
    $("addbox").scrollIntoView({behavior:"smooth",block:"center"});return;
  }
  cur=s;$("cn").textContent=s.n;status("جاري الاتصال…");
  const u=url(s);
  if(hls){hls.destroy();hls=null}
  if(/\.m3u8/i.test(u)&&!au.canPlayType("application/vnd.apple.mpegurl")&&window.Hls&&Hls.isSupported()){
    hls=new Hls();hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)au.onerror()});hls.loadSource(u);hls.attachMedia(au);
  }else{au.src=u}
  au.play().catch(()=>{});
  if("mediaSession"in navigator){try{navigator.mediaSession.metadata=new MediaMetadata({title:s.n,artist:"راديو مصر"})}catch(e){}}
  render();
}
function step(d){const v=vis();if(!v.length)return;let i=cur?v.findIndex(s=>s.id===cur.id):-1;i=(i+d+v.length)%v.length;play(v[i])}
$("pp").onclick=()=>{if(!cur){const v=vis();if(v.length)play(v[0]);return}au.paused?au.play().catch(()=>{}):au.pause()};
$("next").onclick=()=>step(-1);$("prev").onclick=()=>step(1);
au.onplaying=()=>{$("pp").textContent="❚❚";status("يعمل الآن 🔴 مباشر")};
au.onpause=()=>{$("pp").textContent="▶";if(cur&&!au.error)status("متوقف")};
au.onwaiting=()=>status("جاري التحميل…");
au.onerror=()=>{$("pp").textContent="▶";status("تعذّر تشغيل هذه المحطة. جرّب محطة أخرى أو حدّث الرابط.",true)};
$("vol").oninput=e=>{au.volume=+e.target.value};au.volume=.8;
$("q").oninput=render;
$("ab").onclick=()=>{
  const n=$("an").value.trim(),u=$("au").value.trim();
  if(!n||!/^https?:\/\//i.test(u)){alert("اكتب اسم المحطة ورابط بث صحيحًا يبدأ بـ https://");return}
  if(editing){urls[editing]=u;sv("eg_urls",urls);const s=all().find(x=>x.id===editing);editing=null;$("an").value="";$("au").value="";$("sl").style.display="none";render();if(s)play(s);return}
  custom.push({id:"c"+Date.now(),n:n,d:"محطة مضافة",c:"custom",u:u});sv("eg_custom",custom);
  $("an").value="";$("au").value="";tab="custom";render();
};
if("mediaSession"in navigator){try{navigator.mediaSession.setActionHandler("nexttrack",()=>step(1));navigator.mediaSession.setActionHandler("previoustrack",()=>step(-1))}catch(e){}}
render();
</script>
</body>
</html>
